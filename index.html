<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Журнал Maryna</title>
<style>
:root { --blue:#1a56a0; --bg:#f7f9fc; --card:#fff; --ok:#2e7d32; --warn:#f9a825; --today:#e8f0fb; }
* { box-sizing:border-box; }
body { font-family:Georgia,'Times New Roman',serif; background:var(--bg); color:#222; margin:0; padding:0 0 60px; }
header { background:var(--blue); color:#fff; padding:14px 18px; position:sticky; top:0; z-index:10; box-shadow:0 2px 8px rgba(0,0,0,.25); }
header h1 { margin:0; font-size:1.2em; } header .sub { font-size:.75em; opacity:.85; margin-top:2px; font-family:Arial; }
main { max-width:900px; margin:16px auto; padding:0 12px; }
.card { background:var(--card); border-radius:10px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,.08); padding:12px 14px; }
.lesson { display:flex; gap:10px; padding:7px 0; border-bottom:1px solid #eef1f6; font-size:.95em; }
.lesson:last-child { border-bottom:none; }
.lesson .no { background:var(--blue); color:#fff; border-radius:50%; min-width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-family:Arial; font-size:.8em; font-weight:bold; flex-shrink:0; margin-top:2px; }
.lesson .d { flex:1; } .lesson .d b { display:block; }
.lesson .t { font-family:Arial; font-size:.76em; color:#666; }
.lesson .theme { color:#333; font-size:.88em; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; font-family:Arial; }
.tabs button { border:1px solid var(--blue); background:#fff; color:var(--blue); padding:7px 13px; border-radius:16px; font-size:.85em; cursor:pointer; }
.tabs button.active { background:var(--blue); color:#fff; }
.subtabs { display:flex; gap:6px; margin-bottom:10px; font-family:Arial; font-size:.85em; }
.subtabs button { border:1px solid #b9c8dd; background:#fff; color:#445; padding:5px 12px; border-radius:14px; cursor:pointer; }
.subtabs button.active { background:#445; color:#fff; border-color:#445; }
.weekstrip { display:flex; gap:5px; overflow-x:auto; padding:4px 0 8px; font-family:Arial; align-items:center; }
.weekstrip .nav { border:none; background:var(--blue); color:#fff; border-radius:8px; min-width:34px; height:44px; font-size:1.1em; cursor:pointer; flex-shrink:0; }
.weekstrip .nav.gray { background:#8ea3c0; }
.daychip { border:1px solid #c9d4e2; background:#fff; border-radius:10px; min-width:56px; padding:5px 4px; text-align:center; cursor:pointer; flex-shrink:0; }
.daychip .wd { font-size:.72em; color:#666; } .daychip .dm { font-size:1.05em; font-weight:bold; }
.daychip .dots { font-size:.55em; color:var(--blue); height:.7em; }
.daychip.sel { border:2px solid var(--blue); background:var(--today); }
.daychip.today .wd { color:var(--blue); font-weight:bold; }
.daychip.empty { opacity:.45; }
.dayinfo { font-family:Arial; font-size:.85em; color:#333; margin:8px 0 4px; line-height:1.6; }
.dayinfo b { color:#1a3a63; }
.breakrow { display:inline-block; background:#eef3fa; border-radius:12px; padding:2px 10px; margin:2px 4px 2px 0; font-size:.9em; }
.breakrow.lunch { background:#fdeeee; color:#a33; }
.weekgrid { display:flex; gap:6px; overflow-x:auto; }
.wcol { min-width:150px; flex:1; background:#fff; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,.08); padding:8px; }
.wcol h4 { margin:0 0 6px; font-family:Arial; font-size:.8em; color:#1a3a63; text-align:center; }
.wcol .wl { font-family:Arial; font-size:.72em; padding:4px 0; border-bottom:1px solid #eef1f6; }
.wcol .wl:last-child { border:none; }
.wcol .wl b { display:block; color:var(--blue); }
#lock { max-width:420px; margin:60px auto; text-align:center; }
#lock input { width:100%; padding:12px; font-size:1.05em; border:1px solid #c9d4e2; border-radius:8px; margin:10px 0; }
#lock button { background:var(--blue); border:none; color:#fff; padding:12px 26px; border-radius:24px; font-size:1em; cursor:pointer; }
#err { color:#c0392b; font-family:Arial; font-size:.85em; min-height:1.2em; }
.note { font-size:.85em; color:#555; font-family:Arial; }
.badge { font-family:Arial; font-size:.7em; padding:2px 8px; border-radius:10px; color:#fff; background:#888; }
.badge.gr { background:var(--ok); }
.muted { color:#999; }
.weekhead { display:flex; align-items:center; gap:10px; margin:6px 0 10px; font-family:Arial; font-size:.85em; }
.weekhead button { border:1px solid var(--blue); background:#fff; color:var(--blue); border-radius:14px; padding:4px 12px; cursor:pointer; }
.weekhead b { flex:1; text-align:center; }
</style>
</head>
<body>
<header><h1>Журнал · Maryna</h1><div class="sub" id="sub">личный электронный журнал</div></header>

<div id="lock">
  <div class="card">
    <p>Введите парольную фразу:</p>
    <input type="password" id="pass" autocomplete="current-password">
    <br><button onclick="decrypt()">Открыть журнал</button>
    <p id="err"></p>
    <p class="note">Данные зашифрованы (AES-256-GCM).</p>
  </div>
</div>

<main id="app" style="display:none">
  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
  <p class="note" style="text-align:center;margin-top:20px" id="syncinfo"></p>
</main>

<script>
let J = null;
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const WDF = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const iso = d => d.toISOString().slice(0,10);
const fromIso = s => new Date(s + 'T12:00:00');
const monday = d => { const x = new Date(d); const w = (x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; };

async function decrypt() {
  const pass = document.getElementById('pass').value;
  const err = document.getElementById('err'); err.textContent = '';
  try {
    const buf = await (await fetch('data.enc')).arrayBuffer();
    const salt = new Uint8Array(buf, 0, 16), iv = new Uint8Array(buf, 16, 12), ct = new Uint8Array(buf, 28);
    const keyMat = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:100000, hash:'SHA-256'}, keyMat,
      {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
    J = JSON.parse(new TextDecoder().decode(pt));
    document.getElementById('lock').style.display = 'none';
    document.getElementById('app').style.display = '';
    document.getElementById('sub').textContent = J.journal.meta.school + ' · класс ' + J.journal.meta.class_name;
    document.getElementById('syncinfo').textContent =
      'Синхронизировано: ' + J.generated_at + (J.journal.meta.plus_active ? '' : ' · оценки и задания — разделы ждут данных');
    buildTabs();
  } catch (e) { err.textContent = 'Неверная фраза или повреждены данные'; }
}

/* ==== данные расписания ==== */
function lessonsByDate() {
  const m = {};
  for (const day of J.journal.lessons) {
    if (!m[day.date]) m[day.date] = [];
    for (const l of (day.lessons||[])) m[day.date].push(l);
  }
  for (const k in m) m[k].sort((a,b)=>a.lesson_number-b.lesson_number);
  return m;
}

/* ==== вид: день ==== */
let selDate = null, viewWeek = null;
function renderSchedule() {
  const m = lessonsByDate();
  if (!selDate) selDate = iso(new Date());
  viewWeek = viewWeek || monday(fromIso(selDate));
  const todayIso = iso(new Date());
  let strip = '<div class="weekstrip"><button class="nav" onclick="shiftWeek(-7)">‹</button>';
  for (let i=0;i<7;i++) {
    const d = new Date(viewWeek); d.setDate(d.getDate()+i);
    const diso = iso(d);
    const n = (m[diso]||[]).length;
    strip += `<div class="daychip ${diso===selDate?'sel':''} ${diso===todayIso?'today':''} ${n?'':'empty'}" onclick="pickDay('${diso}')">
      <div class="wd">${WD[d.getDay()]}</div><div class="dm">${d.getDate()}.${String(d.getMonth()+1).padStart(2,'0')}</div>
      <div class="dots">${n ? '●'.repeat(Math.min(n,8)) : '&nbsp;'}</div></div>`;
  }
  strip += '<button class="nav" onclick="shiftWeek(7)">›</button>' +
           '<button class="nav gray" onclick="goToday()">сегодня</button></div>';
  const day = m[selDate] || [];
  let info;
  if (day.length) {
    const t0 = day[0].time_from, t1 = day[day.length-1].time_to;
    let brk = '';
    for (let i=0;i<day.length-1;i++) {
      const a = day[i].time_to.split(':').map(Number), b = day[i+1].time_from.split(':').map(Number);
      const gap = (b[0]*60+b[1]) - (a[0]*60+a[1]);
      if (gap >= 5) brk += `<span class="breakrow ${gap>=20?'lunch':''}">после ${day[i].lesson_number}-го урока — ${gap} мин${gap>=20?' · ланч-брейк':''}</span>`;
    }
    info = `<b>${WDF[fromIso(selDate).getDay()]}, ${selDate.split('-').reverse().join('.')}</b> · ${day.length} урок(ов) · ` +
           `с <b>${t0}</b> до <b>${t1}</b><br>${brk || '<span class="muted">без перемен ≥5 мин</span>'}`;
  } else {
    info = `<b>${WDF[fromIso(selDate).getDay()]}, ${selDate.split('-').reverse().join('.')}</b> — уроков нет`;
  }
  const rows = day.map(l =>
    '<div class="lesson"><div class="no">'+l.lesson_number+'</div><div class="d"><b>'+esc(l.discipline)+'</b>' +
    (l.theme ? '<div class="theme">'+esc(l.theme)+'</div>' : '') +
    '<div class="t">'+esc(l.time_from)+'–'+esc(l.time_to)+(l.classroom?' · '+esc(l.classroom):'')+(l.teacher?' · '+esc(l.teacher):'')+'</div></div></div>'
  ).join('');
  return strip + '<div class="card"><div class="dayinfo">' + info + '</div>' + rows + '</div>';
}
function pickDay(d){ selDate = d; renderTab('lessons'); }
function shiftWeek(n){ viewWeek = new Date(viewWeek); viewWeek.setDate(viewWeek.getDate()+n); renderTab('lessons'); }
function goToday(){ selDate = iso(new Date()); viewWeek = monday(new Date()); renderTab('lessons'); }

/* ==== вид: неделя семестра ==== */
function renderWeekGrid() {
  const m = lessonsByDate();
  const dates = Object.keys(m).sort();
  let w = viewWeek || monday(new Date());
  let html = '<div class="weekhead"><button onclick="wkShift(-7)">‹ неделя</button><b>' +
    iso(w).slice(5).replace('-','.') + ' – ' + iso(new Date(w.getTime()+6*864e5)).slice(5).replace('-','.') +
    '</b><button onclick="wkShift(7)">неделя ›</button></div><div class="weekgrid">';
  let any = false;
  for (let i=0;i<6;i++) {
    const d = new Date(w); d.setDate(d.getDate()+i);
    const diso = iso(d);
    const ls = m[diso]||[];
    if (i===5 && !ls.length) continue;
    any = any || ls.length;
    html += '<div class="wcol"><h4>' + WD[d.getDay()] + ' ' + d.getDate() + '.' + String(d.getMonth()+1).padStart(2,'0') + '</h4>' +
      (ls.length ? ls.map(l => '<div class="wl"><b>' + l.time_from + ' ' + esc(l.discipline) + '</b>' +
        (l.classroom ? esc(l.classroom) : '') + '</div>').join('') : '<div class="wl muted">—</div>') + '</div>';
  }
  html += '</div>';
  if (!any) html += '<p class="note">На эту неделю уроков в журнале нет (каникулы или данные ещё не загружены).</p>';
  const span = dates.length ? '<p class="note">В журнале недели с ' + dates[0].split('-').reverse().join('.') +
    ' по ' + dates[dates.length-1].split('-').reverse().join('.') + ' — листайте стрелками.</p>' : '';
  return html + span;
}
function wkShift(n){ viewWeek = new Date(viewWeek||monday(new Date())); viewWeek.setDate(viewWeek.getDate()+n); renderTab('lessons'); }

/* ==== вкладки ==== */
const SECTIONS = [['lessons','Расписание'],['grades','Оценки'],['assignments','Задания'],['attendance','Посещаемость'],['activities','Записки']];
let subMode = 'day';
function buildTabs() {
  const t = document.getElementById('tabs'); t.innerHTML = '';
  for (const [k, name] of SECTIONS) {
    const b = document.createElement('button');
    b.textContent = name + (J.journal[k].length ? ' (' + J.journal[k].length + ')' : '');
    b.onclick = () => renderTab(k, b);
    t.appendChild(b);
  }
  renderTab('lessons', t.firstChild);
}
function renderTab(k, btn) {
  if (!btn) btn = [...document.querySelectorAll('#tabs button')][SECTIONS.findIndex(s=>s[0]===k)];
  document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const c = document.getElementById('content');
  if (k === 'lessons') {
    c.innerHTML = '<div class="subtabs"><button class="' + (subMode==='day'?'active':'') + '" onclick="subMode=\'day\';renderTab(\'lessons\')">По дням</button>' +
      '<button class="' + (subMode==='week'?'active':'') + '" onclick="subMode=\'week\';renderTab(\'lessons\')">Неделя семестра</button></div>' +
      (subMode==='day' ? renderSchedule() : renderWeekGrid());
    return;
  }
  const arr = J.journal[k];
  if (!arr.length) {
    c.innerHTML = '<div class="card muted">Пока пусто' +
      ((k==='grades'||k==='assignments') && !J.journal.meta.plus_active ? ' — раздел откроется, когда данные начнут поступать' : '') + '</div>';
    return;
  }
  c.innerHTML = render[k] ? render[k](arr)
    : '<div class="card"><pre style="white-space:pre-wrap;font-size:.85em">' + esc(JSON.stringify(arr, null, 1)) + '</pre></div>';
}
const render = {
  attendance(a) {
    const rows = [];
    for (const d of a) for (const l of (d.lesson||[])) {
      const badge = l.attendance_type === 1 ? '<span class="badge gr">была</span>' : '<span class="badge">тип ' + l.attendance_type + '</span>';
      rows.push('<div class="lesson"><div class="d"><b>' + esc(l.subject) + '</b><div class="t">' + esc(d.date) + '</div></div><div>' + badge + '</div></div>');
    }
    return '<div class="card">' + rows.join('') + '</div>';
  },
  activities(a) {
    const rows = a.map(x => '<div class="lesson"><div class="d"><b>' + esc(x.creator_name || '') + '</b><div class="t">' +
      esc(x.event_date || x.date || '') + (x.absence_type ? ' · ' + esc(x.absence_type) : '') + '</div></div></div>');
    return '<div class="card">' + rows.join('') + '</div>';
  }
};
document.getElementById('pass').addEventListener('keydown', e => { if (e.key === 'Enter') decrypt(); });
</script>
</body>
</html>
